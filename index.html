<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SpinRover: Truck Stories</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0f0f0f;
color:white;
overflow-x:hidden;
}

header{

height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
background:
linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.75)),
url("hero.jpg") center/cover;

}

.hero h1{

font-size:70px;
letter-spacing:4px;
margin-bottom:20px;

}

.hero p{

font-size:22px;
color:#d5d5d5;
margin-bottom:35px;

}

.play-btn{

display:inline-block;
padding:18px 45px;
background:#32cd32;
text-decoration:none;
font-size:22px;
font-weight:bold;
border-radius:8px;
color:white;
transition:.3s;

}

.play-btn:hover{

background:#2db32d;
transform:scale(1.05);

}

section{

padding:70px 8%;

}

.title{

font-size:40px;
margin-bottom:40px;
text-align:center;

}

.gallery{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:25px;

}

.gallery img{

width:100%;
height:240px;
object-fit:cover;
border-radius:12px;
transition:.4s;
cursor:pointer;
border:2px solid #222;

}

.gallery img:hover{

transform:scale(1.04);
border-color:#32cd32;

}

footer{

padding:60px 20px;
text-align:center;
background:#090909;

}

footer h2{

font-size:35px;
margin-bottom:20px;

}

footer p{

color:#aaa;
margin-bottom:30px;

}

.download{

display:inline-block;
padding:20px 50px;
background:#32cd32;
text-decoration:none;
font-size:22px;
font-weight:bold;
border-radius:8px;
color:white;
transition:.3s;

}

.download:hover{

transform:scale(1.05);

}

@media(max-width:768px){

.hero h1{

font-size:45px;

}

.hero p{

font-size:18px;

}

.title{

font-size:32px;

}

}

</style>

</head>

<body>

<header>

<div class="hero">

<h1>SpinRover: Truck Stories</h1>

<p>Drive powerful trucks through forests, muddy roads, mountains and dangerous terrain.</p>

<a class="play-btn"
href="https://play.google.com/store/apps/details?id=com.VectorXYZ.SpinRover"
target="_blank">

DOWNLOAD NOW

</a>

</div>

</header>

<section>

<h2 class="title">Gallery</h2>

<div class="gallery">

<img src="gallery1.jpg" alt="">
<img src="gallery2.jpg" alt="">
<img src="gallery3.jpg" alt="">
<img src="gallery4.jpg" alt="">
<img src="gallery5.jpg" alt="">
<img src="gallery6.jpg" alt="">

</div>

</section>

<footer>

<h2>Ready to Drive?</h2>

<p>Download now and begin your trucking adventure.</p>

<a class="download"
href="https://play.google.com/store/apps/details?id=com.VectorXYZ.SpinRover"
target="_blank">

GET IT ON GOOGLE PLAY

</a>

</footer>

</body>
</html>
